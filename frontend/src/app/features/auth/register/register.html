<div class="auth-card">
  <h1>რეგისტრაცია</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      სახელი
      <input type="text" formControlName="displayName" autocomplete="name" />
      @if (form.controls.displayName.invalid && form.controls.displayName.touched) {
        <small class="hint error">სახელი უნდა შეიცავდეს მინიმუმ 2 სიმბოლოს</small>
      }
    </label>

    <label>
      ელფოსტა
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <small class="hint error">შეიყვანე სწორი ელფოსტა</small>
      }
    </label>

    <label>
      პაროლი
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="hint error">მინ. 8 სიმბოლო, დიდი და პატარა ასო, ციფრი და სპეც-სიმბოლო (მაგ. !, @, #)</small>
      } @else {
        <small class="hint">მინ. 8 სიმბოლო, დიდი და პატარა ასო, ციფრი და სპეც-სიმბოლო (მაგ. !, @, #)</small>
      }
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        რეგისტრაცია...
      } @else {
        რეგისტრაცია
      }
    </button>
  </form>

  <p>
    ანგარიში გაქვს? <a routerLink="/login">შესვლა</a>
  </p>
</div>

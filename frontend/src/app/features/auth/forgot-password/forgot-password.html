<div class="auth-card">
  <div class="auth-brand">OBD<span>360</span></div>

  <h1>პაროლის აღდგენა</h1>

  @if (!result()) {
    <p class="auth-intro">
      შეიყვანე ანგარიშის ელფოსტა — გამოგიგზავნით პაროლის აღდგენის ბმულს.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        ელფოსტა
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="hint error">შეიყვანე სწორი ელფოსტა</small>
        }
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'იგზავნება...' : 'ბმულის გაგზავნა' }}
      </button>
    </form>
  } @else {
    <p class="auth-message">{{ result()!.message }}</p>

    @if (result()!.devResetUrl) {
      <a class="dev-link" [href]="result()!.devResetUrl">
        Development რეჟიმი: აღდგენის ბმულის გახსნა
      </a>
    }

    <a class="auth-back" routerLink="/login">← დაბრუნება შესვლაზე</a>
  }
</div>
